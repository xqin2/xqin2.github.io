name: Install matching journal-version PDFs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/journal_pdf_sources.json'
      - '.github/scripts/install_journal_pdfs.py'
      - '.github/workflows/install-journal-pdfs.yml'
permissions:
  contents: write
concurrency:
  group: journal-pdf-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public homepage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install only hash-verified exact journal PDFs
        run: python3 .github/scripts/install_journal_pdfs.py
      - name: Commit successfully installed PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/papers/ .github/journal_pdf_status.json
          if git diff --cached --quiet; then
            echo "No new verified PDFs." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Install exact verified journal PDF versions"
            git push origin HEAD:main
          fi
